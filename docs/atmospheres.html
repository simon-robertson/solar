<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solar — Atmosphere fixtures</title><style>
:root{color-scheme:dark;font-family:Arial,sans-serif}body{margin:24px auto;padding:0 24px;max-width:1100px;background:#080a0c;color:#edf1f4}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:24px}a{color:inherit}p{color:#aeb8c2;font-size:13px;line-height:1.6}.controls{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin:20px 0}label{font-size:13px}select,button{padding:9px;background:#192026;color:inherit;border:1px solid #4c5963}canvas{display:block;width:min(100%,960px);height:auto;aspect-ratio:16/9;background:#000}output{display:block;margin-top:16px;font:12px/1.7 monospace;white-space:pre-wrap}button:disabled{opacity:.4}
</style><script type="module" src="./src/atmosphere-preview.js"></script></head><body><header><h1>Atmosphere fixtures</h1><a href="./">Return to Solar</a></header><p>Fixed camera, J2000 texture rotation, isolated body and a Sun with an angular radius of 0.27°. Bloom is off to isolate atmospheric scattering. These are controlled rendering checks, rather than ephemeris views.</p><div class="controls"><label>Body <select id="body"><option value="3">Earth</option><option value="4">Mars</option><option value="2">Venus</option><option value="5">Jupiter</option><option value="6">Saturn</option><option value="7">Uranus</option><option value="8">Neptune</option><option value="1">Mercury</option><option value="9">Moon</option></select></label><label>Phase <select id="phase"><option value="0">Full</option><option value="90" selected>Half lit</option><option value="150">Crescent</option><option value="180">Backlit</option></select></label><label><input type="checkbox" id="atmospheres" checked> Atmospheres</label><button id="benchmark" disabled>Measure rendering cost</button></div><canvas id="fixture" aria-label="Controlled atmosphere rendering"></canvas><output id="status">Loading…</output><output id="timing"></output></body></html>
